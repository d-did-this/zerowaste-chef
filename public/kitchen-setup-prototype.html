<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZeroWaste Chef | Step 2: Kitchen Setup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #E0E5EC;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #3D4852;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    @media (min-width: 640px) {
      body {
        padding: 16px;
      }
    }

    /* EXACT official_v3.0 Phone Container */
    .phone-container {
      width: 100%;
      height: 100vh;
      background: #E0E5EC;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      margin: 0 auto;
      box-sizing: border-box;
      padding: 12px;
      justify-content: space-between;
    }

    @media (min-width: 640px) {
      .phone-container {
        width: 390px;
        height: 844px;
        max-height: 844px;
        border-radius: 44px;
        box-shadow: 
          9px 9px 16px rgba(163, 177, 198, 0.6), 
          -9px -9px 16px rgba(255, 255, 255, 0.6),
          0 25px 50px -12px rgba(0, 0, 0, 0.25);
      }
    }

    /* Neumorphic primitives */
    .neo-raised {
      background: #E0E5EC;
      box-shadow: 5px 5px 12px rgba(163, 177, 198, 0.5), -5px -5px 12px rgba(255, 255, 255, 0.75);
      border: none;
    }

    .neo-sunken {
      background: #E0E5EC;
      box-shadow: inset 4px 4px 8px rgba(163, 177, 198, 0.55), inset -4px -4px 8px rgba(255, 255, 255, 0.65);
      border: none;
    }

    .neo-button {
      background: #E0E5EC;
      box-shadow: 5px 5px 10px rgba(163, 177, 198, 0.5), -5px -5px 10px rgba(255, 255, 255, 0.7);
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .neo-button:active {
      box-shadow: inset 3px 3px 6px rgba(163, 177, 198, 0.6), inset -3px -3px 6px rgba(255, 255, 255, 0.6);
      transform: translateY(1px);
    }

    /* TOP HEADER (Clean back navigation, no 3 dots) */
    .header-bar {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 2px;
      flex-shrink: 0;
      z-index: 20;
    }

    .header-btn {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #004730;
      font-size: 18px;
      cursor: pointer;
      text-decoration: none;
    }

    /* MAIN SCROLLABLE AREA */
    .main-scrollable {
      flex: 1;
      overflow-y: auto;
      padding: 4px 2px 8px 2px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .main-scrollable::-webkit-scrollbar {
      display: none;
    }
    .main-scrollable {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* PROGRESS STEPPER (Positioned ABOVE the Cuisines and Appliances Bar) */
    .stepper-stage-nav {
      width: 100%;
      height: 36px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 12px;
      margin-bottom: 2px;
      flex-shrink: 0;
    }

    .stepper-node {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      text-decoration: none;
    }

    .node-num {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      font-size: 10px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #CBD5E1;
      color: #475569;
    }

    .node-label {
      font-size: 11px;
      font-weight: 600;
      color: #64748B;
      letter-spacing: -0.01em;
    }

    .stepper-node.is-active .node-num {
      background: #006948;
      color: #FFFFFF;
      box-shadow: 0 2px 4px rgba(0, 105, 72, 0.25);
    }

    .stepper-node.is-active .node-label {
      color: #004730;
      font-weight: 800;
    }

    .stepper-node.is-done .node-num {
      background: #004730;
      color: #FFFFFF;
    }

    .stepper-node.is-done .node-label {
      color: #004730;
      font-weight: 700;
    }

    .stepper-connector {
      width: 14px;
      height: 2px;
      background: #CBD5E1;
      border-radius: 1px;
    }

    .stepper-connector.is-done {
      background: #006948;
    }

    /* PREFERENCE SELECTION SUMMARY CARD (Fixed natural shadows, Sentence case labels) */
    .preference-summary-card {
      border-radius: 20px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
      background: #E0E5EC;
      box-shadow: 3px 3px 8px rgba(163, 177, 198, 0.35), -3px -3px 8px rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.65);
    }

    .preference-lines-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .pref-block {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    /* First letter capital only, no all-caps */
    .pref-label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      color: #004730;
      letter-spacing: -0.01em;
    }

    .pref-chips-container {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .pref-chip {
      display: inline-flex;
      align-items: center;
      padding: 2.5px 7.5px;
      border-radius: 8px;
      font-size: 9.5px;
      font-weight: 700;
      background: #004730;
      color: #FFFFFF;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .pref-chip-secondary {
      background: #2D3748;
      color: #FFFFFF;
    }

    .pref-chip-empty {
      font-size: 9.5px;
      font-style: italic;
      color: #94A3B8;
    }

    .pref-divider {
      height: 1px;
      background: rgba(163, 177, 198, 0.25);
      border-bottom: 1px solid rgba(255, 255, 255, 0.7);
      margin: 2px 0;
      width: 100%;
    }

    /* Clean Recipe Match Badge (Zero harsh inset shadows, subtle emerald tint) */
    .recipe-match-square {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: rgba(0, 71, 48, 0.05);
      border: 1.5px solid rgba(0, 71, 48, 0.16);
      box-shadow: none;
    }

    .match-num {
      font-size: 22px;
      font-weight: 800;
      color: #004730;
      line-height: 1;
    }

    .match-lbl {
      font-size: 8px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #004730;
      margin-top: 2px;
      line-height: 1;
    }

    .match-sub {
      font-size: 6.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: #64748B;
      line-height: 1;
    }

    /* PROMPT HEADING (With generous gap above) */
    .prompt-section {
      padding: 6px 4px 2px 4px;
      flex-shrink: 0;
    }

    .prompt-title {
      font-size: 15.5px;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .prompt-sub {
      font-size: 11px;
      color: #64748B;
      margin-top: 3px;
      line-height: 1.35;
    }

    /* BOTTOM CTA BUTTON */
    .bottom-cta-wrap {
      flex-shrink: 0;
      padding-top: 8px;
      padding-bottom: 2px;
      z-index: 20;
    }

    .cta-button {
      width: 100%;
      height: 48px;
      border-radius: 20px;
      background: #006948;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 5px 5px 12px rgba(163, 177, 198, 0.6), -5px -5px 12px rgba(255, 255, 255, 0.6);
      transition: all 0.2s ease;
      border: none;
      text-decoration: none;
    }

    .cta-button:active {
      transform: translateY(1px);
      box-shadow: inset 3px 3px 6px rgba(0, 30, 18, 0.75);
    }


    /* Kitchen Stage: Perfect 928x1152 Coordinate Mapping */
    .kitchen-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 928 / 1152;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: inset 4px 4px 10px rgba(163, 177, 198, 0.6), inset -4px -4px 10px rgba(255, 255, 255, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.6);
      background: #DCE1E8;
    }

    .kitchen-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .hotspot-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    .appliance-hotspot {
      fill: rgba(228, 232, 238, 0.52);
      stroke: transparent;
      stroke-width: 4;
      stroke-linejoin: round;
      stroke-linecap: round;
      cursor: pointer;
      outline: none;
      transition: fill 200ms ease, stroke 200ms ease, stroke-width 200ms ease;
    }

    .appliance-hotspot:not(.is-selected):hover {
      fill: rgba(228, 232, 238, 0.12);
      stroke: rgba(16, 185, 129, 0.8);
      stroke-width: 3.5;
      stroke-dasharray: 8 5;
    }

    .appliance-hotspot.is-selected {
      fill: rgba(16, 185, 129, 0.03);
      stroke: #10B981;
      stroke-width: 3.5;
      filter: drop-shadow(0 2px 4px rgba(16, 185, 129, 0.4));
    }

    .appliance-hotspot.is-selected:hover {
      stroke: #059669;
      stroke-width: 4;
    }

    .label-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }

    .appliance-pill {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
      padding: 4px 10px;
      font-size: 10px;
      font-weight: 800;
      border-radius: 9999px;
      transition: all 200ms cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
    }

    .appliance-pill.is-selected {
      background: #10B981;
      color: #FFFFFF;
      border: 1.5px solid rgba(255, 255, 255, 0.9);
    }

    .appliance-pill:not(.is-selected) {
      background: rgba(30, 41, 59, 0.88);
      color: #F8FAFC;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(4px);
    }

    .appliance-pill:hover,
    .appliance-pill.is-hovered {
      transform: translate(-50%, -50%) scale(1.06);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.45);
    }
  </style>
</head>
<body>

  <!-- EXACT official_v3.0 Phone Container -->
  <div class="phone-container">

    <!-- 1. Header (Clean back navigation, no 3 dots) -->
    <header class="header-bar">
      <button class="header-btn neo-button" onclick="goToCuisines()" title="Back to Cuisines">
        <span class="material-symbols-outlined" style="font-size: 20px;">arrow_back</span>
      </button>
    </header>

    <!-- 2. Scrollable Content Area -->
    <main class="main-scrollable">

      <!-- Progress Stepper (MOVED ABOVE Cuisines & Appliances Bar) -->
      <nav class="stepper-stage-nav neo-sunken" aria-label="Creation Steps">
        <a class="stepper-node is-done" onclick="goToCuisines()" title="Edit Cuisines">
          <span class="node-num"><span class="material-symbols-outlined" style="font-size: 12px;">check</span></span>

      <!-- Preference Summary Box: Cuisines (stacked) + Appliances (stacked) + Realtime Match Square -->
      <section class="preference-summary-card">
        <div class="preference-lines-col">
          
          <!-- Cuisines Block (Only first letter capitalized) -->
          <div class="pref-block">
            <span class="pref-label">
              <span class="material-symbols-outlined" style="font-size: 13px;">restaurant_menu</span>
              Cuisines:
            </span>
            <div class="pref-chips-container" id="step2-cuisines-chips">
              <span class="pref-chip">All Cuisines (6)</span>
            </div>
          </div>

          <div class="pref-divider"></div>

          <!-- Appliances Block (Only first letter capitalized) -->
          <div class="pref-block">
            <span class="pref-label">
              <span class="material-symbols-outlined" style="font-size: 13px;">microwave</span>
              Appliances:
            </span>
            <div class="pref-chips-container" id="step2-appliances-chips">
              <span class="pref-chip pref-chip-secondary">8 Appliances</span>
            </div>
          </div>

        </div>

        <!-- Embedded Real-time Estimated Match Square -->
        <div class="recipe-match-square">
          <span class="match-num" id="step2-recipe-count">8</span>
          <span class="match-lbl">Recipes</span>
          <span class="match-sub">Est. Match</span>
        </div>
      </section>

      <!-- Prompt Heading (With bigger gap above title, short sentence) -->

        <h1 class="prompt-title">What would you like using to cook today?</h1>
        <p class="prompt-sub">Tap appliances you want to use today.</p>

  <script>
    const TARGET_CUISINES_URL = 'cuisine-menu-prototype.html';

    const cuisinesState = {
      any: true,
      malay: true,
      chinese: true,
      indian: true,
      'sabah-sarawak': true,
      others: true
    };

    const appliancesState = {
      stove: true,
      wok: true,
      pot: true,
      blender: true,
      rice_cooker: true,
      oven: true,
      air_fryer: true,
      microwave: true
    };

    const appNameMap = {
      stove: 'Stove',
      wok: 'Frying Pan',
      pot: 'Pot',
      blender: 'Blender',
      rice_cooker: 'Rice Cooker',
      oven: 'Oven',
      air_fryer: 'Air Fryer',
      microwave: 'Microwave'
    };

    function initFromParams() {
      const params = new URLSearchParams(window.location.search);
      if (params.has('cuisines')) {
        const cList = params.get('cuisines').split(',');
        if (cList.includes('any')) {
          Object.keys(cuisinesState).forEach(k => { cuisinesState[k] = true; });
        } else {
          Object.keys(cuisinesState).forEach(k => { cuisinesState[k] = false; });
          cList.forEach(k => { if (cuisinesState.hasOwnProperty(k)) cuisinesState[k] = true; });
        }
      }
      if (params.has('appliances')) {
        const aList = params.get('appliances').split(',');
        Object.keys(appliancesState).forEach(k => { appliancesState[k] = false; });
        aList.forEach(k => { if (appliancesState.hasOwnProperty(k)) appliancesState[k] = true; });
      }
      updateUI();
    }

    function toggleAppliance(key) {
      if (appliancesState.hasOwnProperty(key)) {
        appliancesState[key] = !appliancesState[key];
        updateUI();
      }
    }

    function setHoverState(key, isHovered) {
      const pill = document.getElementById('pill-' + key);
      if (pill) {
        if (isHovered) pill.classList.add('is-hovered');
        else pill.classList.remove('is-hovered');
      }
    }

    function updateUI() {
      // Update Illustration Hotspots & Pills
      Object.keys(appliancesState).forEach(key => {
        const isAct = appliancesState[key];
        const poly = document.getElementById('poly-' + key);
        if (poly) {
          if (isAct) poly.classList.add('is-selected');
          else poly.classList.remove('is-selected');
        }
        const pill = document.getElementById('pill-' + key);
        if (pill) {
          if (isAct) pill.classList.add('is-selected');
          else pill.classList.remove('is-selected');
        }
      });

      // Cuisines Chips
      const cuisinesChipsContainer = document.getElementById('step2-cuisines-chips');
      const selectedCuisineNames = [];
      if (cuisinesState.any) {
        selectedCuisineNames.push('All Cuisines (6)');
      } else {
        if (cuisinesState.malay) selectedCuisineNames.push('Malay');
        if (cuisinesState.chinese) selectedCuisineNames.push('Chinese');
        if (cuisinesState.indian) selectedCuisineNames.push('Indian');
        if (cuisinesState['sabah-sarawak']) selectedCuisineNames.push('Borneo');
        if (cuisinesState.others) selectedCuisineNames.push('Others');
      }
      if (selectedCuisineNames.length === 0) {
        cuisinesChipsContainer.innerHTML = '<span class="pref-chip-empty">None Selected</span>';
      } else {
        cuisinesChipsContainer.innerHTML = selectedCuisineNames
          .map(name => `<span class="pref-chip">${name}</span>`)
          .join('');
      }

      // Appliances Chips
      const appliancesChipsContainer = document.getElementById('step2-appliances-chips');
      const selectedAppKeys = Object.keys(appliancesState).filter(k => appliancesState[k]);

      if (selectedAppKeys.length === 8) {
        appliancesChipsContainer.innerHTML = '<span class="pref-chip pref-chip-secondary">8 Appliances</span>';
      } else if (selectedAppKeys.length === 0) {
        appliancesChipsContainer.innerHTML = '<span class="pref-chip-empty">None Selected</span>';
      } else {
        appliancesChipsContainer.innerHTML = selectedAppKeys
          .map(k => `<span class="pref-chip pref-chip-secondary">${appNameMap[k] || k}</span>`)
          .join('');
      }

      // Dynamic Recipe Estimate
      let matchCount = 0;
      if (selectedCuisineNames.length > 0 && selectedAppKeys.length > 0) {
        if (cuisinesState.any && selectedAppKeys.length === 8) {
          matchCount = 8;
        } else {
          const cScore = cuisinesState.any ? 6 : (selectedCuisineNames.length);
          const aScore = selectedAppKeys.length;
          matchCount = Math.max(1, Math.min(8, Math.round((cScore / 6) * 4 + (aScore / 8) * 4)));
        }
      }

      document.getElementById('step2-recipe-count').textContent = matchCount;
    }

    function goToCuisines() {
      const selected = Object.keys(cuisinesState).filter(k => cuisinesState[k]);
      const appSelected = Object.keys(appliancesState).filter(k => appliancesState[k]);
      const params = new URLSearchParams();
      params.set('cuisines', selected.join(','));
      params.set('appliances', appSelected.join(','));
      window.location.href = TARGET_CUISINES_URL + '?' + params.toString();
    }

    function goToStep3() {
      const appSelected = Object.keys(appliancesState).filter(k => appliancesState[k]);
      if (appSelected.length === 0) {
        alert('Please select at least one appliance to proceed!');
        return;
      }
      alert('Step 3 (Recipes Matched) will load recipes filtered by your preferences!');
    }

    document.addEventListener('DOMContentLoaded', initFromParams);
  </script>
</body>
</html>
