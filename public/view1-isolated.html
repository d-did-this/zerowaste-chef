<style>
  @layer base {
    html, body { width: 100vw; margin: 0; padding: 0; }
    body { overscroll-behavior: none; min-height: 100dvh; background-color: #E0E5EC; color: #3D4852; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
  }
  ::-webkit-scrollbar { display: none; }

  /* ==========================================================
     PURE NEUMORPHIC (SOFT UI) GREEN DESIGN TOKENS
     - Monochromatic cool clay surface (#E0E5EC)
     - ZERO BORDERS: Shadows define 100% of edges
     - Opposing light (top-left) and dark (bottom-right) RGBA shadows
     ========================================================== */
  .neo-raised {
    background: #E0E5EC;
    box-shadow: 9px 9px 16px rgba(163, 177, 198, 0.6), -9px -9px 16px rgba(255, 255, 255, 0.6);
    border: none !important;
  }
  .neo-raised-sm {
    background: #E0E5EC;
    box-shadow: 5px 5px 10px rgba(163, 177, 198, 0.6), -5px -5px 10px rgba(255, 255, 255, 0.6);
    border: none !important;
  }
  .neo-sunken {
    background: #E0E5EC;
    box-shadow: inset 6px 6px 10px rgba(163, 177, 198, 0.6), inset -6px -6px 10px rgba(255, 255, 255, 0.6);
    border: none !important;
  }
  .neo-bar-top {
    background: rgba(224, 229, 236, 0.95);
    box-shadow: 0 6px 16px rgba(163, 177, 198, 0.45);
    border: none !important;
  }
  /* PURE NEUMORPHIC CRATER: Surface color, deep inset shadow, NO green fill, NO border */
  .neo-crater {
    background: #E0E5EC !important;
    box-shadow: inset 10px 10px 20px rgba(163, 177, 198, 0.75), inset -10px -10px 20px rgba(255, 255, 255, 0.7) !important;
    border: none !important;
    color: #004730 !important;
  }
</style>

<body class="min-h-screen flex items-center justify-center p-4">
  <!-- Mobile Container: Pure Neumorphism, Zero White Border Outlines -->

          </div>
        </div>

        <!-- Bottom Shutter & Mode Action Deck (Sculpted Tray) -->
        <div class="w-full neo-raised rounded-2xl p-space-md flex flex-col space-y-4">
          <div class="w-full neo-sunken rounded-2xl p-3 flex items-center justify-around">
            <button class="flex flex-col items-center justify-center gap-1 p-2.5 min-w-[72px] rounded-xl neo-raised-sm active:scale-95 transition-all text-on-surface" id="upload-mode-btn">
              <span class="material-symbols-outlined text-2xl text-on-surface-variant">photo_library</span>

            </button>
            <div class="flex flex-col items-center">

                <!-- Circular Loading Spinner Ring (Spins in circle as loading indicator) -->

                    <!-- Dynamic Spinning Loading Arc -->

                    <defs>

                        <stop offset="50%" stop-color="#00855D" />

                <!-- Center Shutter Button -->

            </div>
            <button class="flex flex-col items-center justify-center gap-1 p-2.5 min-w-[72px] rounded-xl neo-raised-sm active:scale-95 transition-all text-on-surface" id="manual-mode-btn">

              <span class="material-symbols-outlined text-base opacity-60">barcode_scanner</span>
              <span>Coming Soon</span>
            </button>
            <button class="flex-1 py-2.5 px-space-md rounded-full neo-raised-sm font-label-md text-label-md font-semibold text-on-surface-variant hover:text-on-surface flex items-center justify-center gap-1.5 active:scale-95 transition-all">

    </div>

    <!-- Toast Notification Pill for Delight Moments -->
    <div class="absolute bottom-24 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-full bg-inverse-surface text-inverse-on-surface font-label-sm text-label-sm shadow-xl flex items-center gap-2 transition-all duration-300 z-50 opacity-0 pointer-events-none" id="scanner-toast">
      <span class="material-symbols-outlined text-primary-fixed-dim text-base">check_circle</span>

    </div>

    <!-- Bottom Navigation: Rounded Island with Green Background -->
    <nav class="mt-2.5 mb-1 mx-1 h-16 px-2 rounded-3xl bg-[#004730] grid grid-cols-4 items-center gap-1.5 shrink-0 z-20"

      <!-- Scan Tab (Active: Carved in like a crater, current style) -->
      <button class="h-12 rounded-2xl neo-crater flex flex-col items-center justify-center font-bold">
        <span class="material-symbols-outlined text-xl leading-none">photo_camera</span>

      <!-- Pantry Tab -->

      <!-- Cook Tab (Soon) -->
      <button class="h-12 rounded-2xl flex flex-col items-center justify-center text-white/75 hover:text-white relative transition-colors">
        <span class="material-symbols-outlined text-xl leading-none">skillet</span>
        <span class="text-[9px] font-semibold mt-0.5 leading-none">Cook</span>
        <span class="text-[7px] font-extrabold uppercase px-1 rounded-full bg-amber-100 text-amber-800 absolute top-1 right-1.5">Soon</span>
      </button>
      <!-- Grocery Tab (Soon - As requested!) -->
      <button class="h-12 rounded-2xl flex flex-col items-center justify-center text-white/75 hover:text-white relative transition-colors">
        <span class="material-symbols-outlined text-xl leading-none">shopping_cart</span>
        <span class="text-[9px] font-semibold mt-0.5 leading-none">Grocery</span>
        <span class="text-[7px] font-extrabold uppercase px-1 rounded-full bg-amber-100 text-amber-800 absolute top-1 right-1.5">Soon</span>
      </button>
    </nav>
  </div>

  <script>
    (function initScannerHUD() {
      // Zoom control toggling
      const zoomButtons = document.querySelectorAll('.zoom-btn');
      zoomButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          zoomButtons.forEach(b => {
            b.classList.remove('bg-primary', 'text-on-primary', 'font-bold', 'shadow-sm');
            b.classList.add('text-on-surface-variant', 'font-medium');
          });
          btn.classList.add('bg-primary', 'text-on-primary', 'font-bold', 'shadow-sm');
          btn.classList.remove('text-on-surface-variant', 'font-medium');
          showToast('Camera switched to ' + btn.getAttribute('data-zoom'));
        });
      });

      // Flash/Torch Toggle
      const torchBtn = document.getElementById('torch-btn');
      if (torchBtn) {
        let torchOn = false;
        torchBtn.addEventListener('click', () => {
          torchOn = !torchOn;
          const icon = torchBtn.querySelector('.material-symbols-outlined');
          if (icon) {
            icon.textContent = torchOn ? 'flash_off' : 'flash_on';
          }
          if (torchOn) {
            torchBtn.classList.remove('neo-raised-sm');
            torchBtn.classList.add('neo-sunken', 'text-primary');
            showToast('Torch activated');
          } else {
            torchBtn.classList.remove('neo-sunken', 'text-primary');
            torchBtn.classList.add('neo-raised-sm');
            showToast('Torch deactivated');
          }
        });
      }

      // Camera Flip Button
      const flipBtn = document.getElementById('flip-camera-btn');
      if (flipBtn) {
        flipBtn.addEventListener('click', () => {
          showToast('Flipping sensor to macro mode');
        });
      }

      // Shutter Trigger Delight & Real Circular Loading State
      const shutter = document.getElementById('main-shutter-btn');
      const spinnerSvg = document.getElementById('shutter-spinner-svg');
      const cameraIcon = document.getElementById('shutter-camera-icon');
      const statusLabel = document.getElementById('shutter-status-label');
      let isScanning = false;

      if (shutter) {
        shutter.addEventListener('click', () => {
          if (isScanning) return;
          isScanning = true;

          // Accelerated loading spin animation
          if (spinnerSvg) {
            spinnerSvg.classList.remove('animate-[spin_2.5s_linear_infinite]');
            spinnerSvg.classList.add('animate-[spin_0.75s_linear_infinite]');
          }
          shutter.classList.remove('neo-raised-sm');
          shutter.classList.add('neo-sunken');
          if (cameraIcon) {
            cameraIcon.classList.add('animate-pulse', 'text-emerald-600');
          }
          if (statusLabel) {
            statusLabel.textContent = 'Scanning...';
            statusLabel.classList.add('text-[#004730]');
          }
          showToast('AI Scanning: Detecting produce & freshness...');

          // Loading completes after 2s
          setTimeout(() => {
            if (spinnerSvg) {
              spinnerSvg.classList.remove('animate-[spin_0.75s_linear_infinite]');
              spinnerSvg.classList.add('animate-[spin_2.5s_linear_infinite]');
            }
            shutter.classList.remove('neo-sunken');
            shutter.classList.add('neo-raised-sm');
            if (cameraIcon) {
              cameraIcon.classList.remove('animate-pulse', 'text-emerald-600');
            }
            if (statusLabel) {
              statusLabel.textContent = 'AI Scan';
              statusLabel.classList.remove('text-[#004730]');
            }
            showToast('Detected: Fresh Sweet Corn (98% match)!');
            isScanning = false;
          }, 2000);
        });
      }
    })();

    // Toast Messenger Helper
    function showToast(msg) {
      const toast = document.getElementById('scanner-toast');
      const toastMsg = document.getElementById('toast-message');
      if (!toast || !toastMsg) return;
      toastMsg.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2400);
    }
  </script>
</body>
</html>
